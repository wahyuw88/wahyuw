<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hubungi pemilik website pribadi.">
  <title>Kontak | Website Pribadi</title><link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="/">Website Saya<span>.</span></a><button class="menu-toggle" aria-label="Buka menu" aria-expanded="false">☰</button><nav class="nav"><a href="/">Beranda</a><a href="/tentang.html">Tentang</a><a href="/artikel.html">Artikel</a><a class="nav-cta active" href="/kontak.html">Hubungi Saya</a></nav></header>
  <main class="container page-main">
    <p class="eyebrow">KONTAK</p><h1>Mari terhubung.</h1><p class="page-lead">Gunakan formulir ini untuk mencoba endpoint kontak. Pada starter ini pesan belum disimpan atau dikirim melalui email.</p>
    <form class="contact-form" id="contact-form">
      <label for="nama">Nama</label><input id="nama" name="nama" required maxlength="100" autocomplete="name">
      <label for="email">Email</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email">
      <label for="pesan">Pesan</label><textarea id="pesan" name="pesan" rows="6" required maxlength="5000"></textarea>
      <button class="button" type="submit">Kirim pesan →</button>
      <p id="form-status" class="form-status" role="status"></p>
    </form>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><a class="brand" href="/">Website Saya<span>.</span></a><p>© <span data-year></span> Website Saya.</p></div></footer><script src="/assets/app.js"></script>
</body></html>
